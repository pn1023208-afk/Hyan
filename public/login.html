<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Đăng nhập</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:#f4f7fb; color:#16202c; font:14px/1.5 "Segoe UI", system-ui, sans-serif; }
  .box { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:28px; width:360px; }
  h1 { margin:0 0 4px; font-size:19px; }
  p.sub { margin:0 0 20px; color:#64748b; font-size:13px; }
  label { display:block; margin-bottom:14px; font-size:13px; color:#475569; }
  input { width:100%; margin-top:5px; padding:9px 11px; font:inherit;
          border:1px solid #e2e8f0; border-radius:8px; }
  button { width:100%; padding:10px; font:inherit; font-weight:600; color:#fff; cursor:pointer;
           background:#0d9488; border:0; border-radius:8px; }
  .msg { padding:9px 11px; border-radius:8px; font-size:13px; margin-bottom:16px; }
  .err { background:#fef2f2; color:#dc2626; }
  .ok  { background:#ecfdf5; color:#047857; }
  .foot { margin-top:16px; text-align:center; font-size:13px; color:#64748b; }
  a { color:#0d9488; }
</style>
</head>
<body>
  <form class="box" method="post" action="/login">
    <h1>Đăng nhập</h1>
    <p class="sub">Quản lý tài khoản quảng cáo</p>
    <div id="msg"></div>
    <label>Email
      <input type="email" name="email" required autocomplete="username" />
    </label>
    <label>Mật khẩu
      <input type="password" name="password" required autocomplete="current-password" />
    </label>
    <button type="submit">Đăng nhập</button>
    <div class="foot">Chưa có tài khoản? <a href="/register">Đăng ký</a></div>
  </form>
<script>
  const params = new URLSearchParams(location.search);
  const box = document.getElementById('msg');
  if (params.has('loi')) box.innerHTML = '<div class="msg err">Sai email hoặc mật khẩu, hoặc tài khoản chưa được duyệt.</div>';
  if (params.has('dangky')) box.innerHTML = '<div class="msg ok">Đăng ký thành công. Chờ quản trị viên duyệt rồi mới đăng nhập được.</div>';
</script>
</body>
</html>
