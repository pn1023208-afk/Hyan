<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Đăng ký</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:#f4f7fb; color:#16202c; font:14px/1.5 "Segoe UI", system-ui, sans-serif; }
  .box { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:28px; width:360px; }
  h1 { margin:0 0 4px; font-size:19px; }
  p.sub { margin:0 0 20px; color:#64748b; font-size:13px; }
  label { display:block; margin-bottom:14px; font-size:13px; color:#475569; }
  input { width:100%; margin-top:5px; padding:9px 11px; font:inherit;
          border:1px solid #e2e8f0; border-radius:8px; }
  button { width:100%; padding:10px; font:inherit; font-weight:600; color:#fff; cursor:pointer;
           background:#0d9488; border:0; border-radius:8px; }
  .msg { padding:9px 11px; border-radius:8px; font-size:13px; margin-bottom:16px;
         background:#fef2f2; color:#dc2626; }
  .note { margin-top:14px; font-size:12px; color:#64748b; }
  .foot { margin-top:16px; text-align:center; font-size:13px; color:#64748b; }
  a { color:#0d9488; }
</style>
</head>
<body>
  <form class="box" method="post" action="/register">
    <h1>Đăng ký</h1>
    <p class="sub">Tài khoản cần quản trị viên duyệt trước khi dùng được</p>
    <div id="msg"></div>
    <label>Họ tên
      <input type="text" name="name" required />
    </label>
    <label>Email
      <input type="email" name="email" required autocomplete="username" />
    </label>
    <label>Mật khẩu
      <input type="password" name="password" required minlength="10" autocomplete="new-password" />
    </label>
    <button type="submit">Đăng ký</button>
    <p class="note">Mật khẩu tối thiểu 10 ký tự. Đừng dùng lại mật khẩu bạn đã dùng ở nơi khác.</p>
    <div class="foot">Đã có tài khoản? <a href="/login">Đăng nhập</a></div>
  </form>
<script>
  if (new URLSearchParams(location.search).has('loi')) {
    document.getElementById('msg').innerHTML = '<div class="msg">Email này đã được đăng ký.</div>';
  }
</script>
</body>
</html>
